name: CMake on multiple platforms

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".editorconfig"
      - ".gitignore"
      - "README.md"
      - "bench/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".editorconfig"
      - ".gitignore"
      - "README.md"
      - "bench/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-26.04, windows-latest, macos-26]
        cpp_compiler: [clang++, g++, cl]
        build_type: [Release]
        exclude:
          - os: windows-latest
            cpp_compiler: g++
          - os: ubuntu-26.04
            cpp_compiler: cl
          - os: macos-26
            cpp_compiler: cl

    steps:
    - uses: actions/checkout@v7

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake (Linux, macOS w/o Clang)
      if: matrix.os != 'windows-latest' && (matrix.os != 'macos-26' || matrix.cpp_compiler != 'clang++')
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }} -G Ninja
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS, Clang)
      if: matrix.os == 'macos-26' && matrix.cpp_compiler == 'clang++'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }} -G Ninja
        -DCMAKE_CXX_COMPILER=$(brew --prefix llvm@20)/bin/clang++
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}


    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

    - uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}-build
        path: build
